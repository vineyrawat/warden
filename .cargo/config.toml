# ts-rs resolves `#[ts(export_to = "...")]` relative to TS_RS_EXPORT_DIR (default "./bindings" inside the
# crate). Pointing it at the warden-core crate dir makes `export_to = "../../ui/src/bindings/"` (as written in
# SPEC.md) land in <repo>/ui/src/bindings. Bindings are (re)generated by `cargo test -p warden-core`.
[env]
TS_RS_EXPORT_DIR = { value = "crates/warden-core", relative = true }
