[package]
name = "warden-core"
version.workspace = true
edition.workspace = true
description = "Warden core: forge clients, checks, CI runner, MCP server, review engine, poster, storage"

# NOTE: every dependency the modules need lives here so module builders never edit this file.

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# misc utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
globset = "0.4"
walkdir = "2"
which = "8"
shlex = "1"
tempfile = "3"
libc = "0.2"

# http / forge
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
octocrab = "0.54"

# storage / secrets
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "json", "chrono", "macros"] }
keyring = { version = "3", features = ["apple-native"] }

# MCP server (streamable HTTP on 127.0.0.1, served via axum)
rmcp = { version = "3.11", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
schemars = { version = "1", features = ["chrono04"] }

# TypeScript bindings for shared types
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
pretty_assertions = "1"
